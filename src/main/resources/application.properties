spring.application.name=retailops-ai

spring.datasource.url=jdbc:mysql://localhost:3306/retailops_ai?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&zeroDateTimeBehavior=CONVERT_TO_NULL
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8081

retailops.ai.api-url=${AI_API_URL:https://api.openai.com/v1/chat/completions}
retailops.ai.api-key=${AI_API_KEY:}
retailops.ai.model=${AI_MODEL:gpt-4o-mini}
