spring.application.name=retailops-ai

spring.datasource.url=jdbc:mysql://localhost:3306/retailops_ai?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&zeroDateTimeBehavior=CONVERT_TO_NULL
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8081

retailops.ai.api-url=${AI_API_URL:https://api.openai.com/v1/chat/completions}
retailops.ai.api-key=${AI_API_KEY:}
retailops.ai.model=${AI_MODEL:gpt-4o-mini}

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
retailops.email.from=${MAIL_FROM:${MAIL_USERNAME:}}
